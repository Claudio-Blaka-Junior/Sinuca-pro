<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sinuca 3D</title>
<style>
:root{--bg:#070b16;--fg:#f2efe6;--accent:#e8b04a;--red:#c8202b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070b16;--fg:#f2efe6;--accent:#e8b04a}}
:root[data-theme="dark"]{--bg:#070b16;--fg:#f2efe6;--accent:#e8b04a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
canvas#c{display:block;width:100%;height:100%}

/* ---------- HUD ---------- */
#top{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:stretch;gap:10px;pointer-events:none;width:min(760px,96vw)}
.pl{flex:1;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:linear-gradient(180deg,#16233fcc,#0b1428cc);border:1px solid #ffffff22;backdrop-filter:blur(4px);transition:box-shadow .25s,border-color .25s}
.pl.right{flex-direction:row-reverse;text-align:right}
.pl.act{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 20px rgba(232,176,74,.45)}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;color:#111;background:radial-gradient(circle at 35% 30%,#fff,#e8b04a 60%,#9a6a14);border:2px solid #fff6}
.pl.right .av{background:radial-gradient(circle at 35% 30%,#fff,#7cc4ff 60%,#25609c)}
.info{min-width:0}
.nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{font-weight:500;opacity:.65}
.slots{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.pl.right .slots{justify-content:flex-end}
.slot{width:17px;height:17px;border-radius:50%;background:#0008;border:1px solid #ffffff2a;font-size:8px;font-weight:800;display:grid;place-items:center;color:#fff;text-shadow:0 0 2px #000}
.slot.on{border-color:#fff8}
#mid{flex:none;align-self:center;padding:6px 12px;border-radius:999px;background:#000a;border:1px solid #ffffff22;font-size:12px;white-space:nowrap}
#mid b{color:var(--accent)}
#toast{position:fixed;top:84px;left:50%;transform:translateX(-50%);max-width:92vw;padding:7px 16px;border-radius:999px;background:#000b;border:1px solid #ffffff22;color:var(--accent);font-size:13px;pointer-events:none;opacity:0;transition:opacity .25s;text-align:center}
#toast.on{opacity:1}
#help{position:fixed;left:14px;bottom:14px;font-size:12px;line-height:1.7;background:rgba(0,0,0,.45);padding:8px 12px;border-radius:10px;pointer-events:none;opacity:.85}
#help b{color:var(--accent)}
#bar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(340px,60vw);height:14px;border:1px solid #fff6;border-radius:8px;overflow:hidden;background:#0009;box-shadow:0 0 14px #0008}
#pw{height:100%;width:0;background:linear-gradient(90deg,#4ade80,#facc15,#ef4444)}

/* ---------- Tela inicial ---------- */
#ov,#end{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:auto;background:#050810}
#end{display:none;flex-direction:column;text-align:center;background:rgba(3,6,14,.8);backdrop-filter:blur(3px);padding:20px;gap:6px}
#end h1{margin:0;font-size:clamp(28px,6vw,48px);color:var(--accent)}
#end p{opacity:.85;margin:0 0 12px}
#bgc{position:absolute;inset:0;width:100%;height:100%}
.wrap{position:relative;z-index:2;width:min(880px,96vw);margin:auto;padding:22px 12px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.logo{display:flex;align-items:center;gap:16px}
.ball8{width:clamp(64px,11vw,96px);height:clamp(64px,11vw,96px);border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:clamp(30px,6vw,48px);color:#111;background:radial-gradient(circle at 32% 28%,#555 0,#111 38%,#000 100%);box-shadow:0 12px 30px #000c,inset -6px -8px 14px #000a;position:relative;animation:bob 3s ease-in-out infinite}
.ball8::before{content:"";position:absolute;width:52%;height:52%;border-radius:50%;background:#f4f1e8;box-shadow:inset -2px -3px 5px #0004}
.ball8 span{position:relative;z-index:1}
.ball8::after{content:"";position:absolute;left:18%;top:12%;width:26%;height:16%;border-radius:50%;background:#fff;opacity:.55;filter:blur(2px);transform:rotate(-30deg)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
h1.title{margin:0;font-size:clamp(44px,10vw,96px);line-height:.95;letter-spacing:.06em;font-weight:900;background:linear-gradient(180deg,#fff3c4 0,#e8b04a 45%,#b4561a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #3a1a05) drop-shadow(0 0 22px rgba(232,176,74,.45));text-align:left}
h1.title span{display:block;font-size:.5em;letter-spacing:.5em;background:linear-gradient(180deg,#ff8a8a,#c8202b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #2a0508);margin-top:4px}
.tag{margin:6px 0 0;text-align:left;font-size:13px;letter-spacing:.2em;text-transform:uppercase;opacity:.8}
.panel{width:100%;padding:14px;border-radius:16px;background:linear-gradient(180deg,#101a33cc,#080e20cc);border:1px solid #ffffff22;backdrop-filter:blur(6px);box-shadow:0 18px 50px #000a}
.panel h3{margin:4px 0 8px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);text-align:left}
.cues{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin-bottom:8px}
.cue-card{cursor:pointer;border:2px solid #ffffff1c;background:#ffffff0a;border-radius:10px;padding:6px 6px 4px;color:var(--fg);font:inherit;font-size:12px;font-weight:600;transition:transform .15s,border-color .15s,background .15s}
.cue-card:hover{transform:translateY(-2px);background:#ffffff16}
.cue-card.sel{border-color:var(--accent);background:#e8b04a1f;box-shadow:0 0 14px rgba(232,176,74,.35)}
.cue-card canvas{display:block;width:100%;height:auto;margin-bottom:3px}
.modes{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{cursor:pointer;border:0;border-radius:12px;padding:12px 22px;font-size:16px;font-weight:800;color:#1a1004;background:linear-gradient(180deg,#ffe08a,#e8b04a 55%,#b9781c);box-shadow:0 5px 0 #6a410b,0 12px 24px #0008;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #6a410b,0 6px 12px #0008}
.btn.big{padding:15px 28px;font-size:clamp(15px,2.4vw,19px)}
.btn.alt{color:#fff;background:linear-gradient(180deg,#ff6a6a,#c8202b 55%,#8a1119);box-shadow:0 5px 0 #4a0709,0 12px 24px #0008}
.btn.alt:active{box-shadow:0 2px 0 #4a0709,0 6px 12px #0008}
.rules{margin:0;font-size:12.5px;opacity:.8;line-height:1.6}
.rules b{color:var(--accent)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <div class="pl" id="pl0"><div class="av">1</div><div class="info"><div class="nm"></div><div class="slots"></div></div></div>
  <div id="mid"></div>
  <div class="pl right" id="pl1"><div class="av">2</div><div class="info"><div class="nm"></div><div class="slots"></div></div></div>
</div>
<div id="toast"></div>
<div id="help"><b>Mouse</b>: a mira segue o cursor · <b>Clique + puxar para baixo</b>: força · <b>Soltar</b>: tacada<br><b>C / Espaço</b>: visão aérea</div>
<div id="bar"><div id="pw"></div></div>

<div id="ov">
  <canvas id="bgc"></canvas>
  <div class="wrap">
    <div class="logo">
      <div class="ball8"><span>8</span></div>
      <div><h1 class="title">SINUCA<span>3D</span></h1><p class="tag">Bola 8 · física realista</p></div>
    </div>
    <div class="panel">
      <h3>Taco do Jogador 1</h3><div class="cues" id="cues0"></div>
      <h3>Taco do adversário</h3><div class="cues" id="cues1"></div>
    </div>
    <div class="modes">
      <button class="btn big" id="b1">🤖 Jogar contra o computador</button>
      <button class="btn big alt" id="b2">👥 Dois jogadores</button>
    </div>
    <p class="rules">Jogador 1: <b>lisas (1–7)</b> · Adversário: <b>listradas (9–15)</b> · A <b>bola 8</b> vai por último.</p>
  </div>
</div>
<div id="end"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script&gt;
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script&gt;
<script>
(function(){
const R=0.3, HX=13, HZ=6.5, PULL_MAX=5, GAP=0.2, PR=0.85; // PR = raio das caçapas
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0a1224);
const camera=new THREE.PerspectiveCamera(55,1,0.1,200);

/* ---------- Física ---------- */
const world=new CANNON.World(); world.gravity.set(0,-60,0);
world.broadphase=new CANNON.NaiveBroadphase(); world.solver.iterations=14;
const mBall=new CANNON.Material('ball'), mWall=new CANNON.Material('wall'), mFloor=new CANNON.Material('floor');
world.addContactMaterial(new CANNON.ContactMaterial(mBall,mBall,{friction:0.05,restitution:0.95}));
world.addContactMaterial(new CANNON.ContactMaterial(mBall,mWall,{friction:0.1,restitution:0.936}));
world.addContactMaterial(new CANNON.ContactMaterial(mBall,mFloor,{friction:0.12,restitution:0}));
const floor=new CANNON.Body({mass:0,shape:new CANNON.Plane(),material:mFloor});
floor.quaternion.setFromEuler(-Math.PI/2,0,0); world.addBody(floor);

/* ---------- Texturas ---------- */
function feltTex(){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  g.fillStyle='#b4161f';g.fillRect(0,0,256,256);
  for(let i=0;i<16000;i++){const v=Math.random()*40-20;g.fillStyle=`rgba(${160+v*3|0},${18+v|0},${26+v|0},0.5)`;g.fillRect(Math.random()*256,Math.random()*256,1.5,1.5);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;return t;}
function leatherTex(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  g.fillStyle='#101b30';g.fillRect(0,0,128,128);
  for(let i=0;i<4000;i++){const v=Math.random()*26;g.fillStyle=`rgba(${20+v},${34+v},${60+v},0.55)`;g.fillRect(Math.random()*128,Math.random()*128,1.6,1.6);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;t.repeat.set(1.5,1.5);return t;}
function markTex(){const c=document.createElement('canvas');c.width=1300;c.height=650;const g=c.getContext('2d');
  g.strokeStyle='rgba(255,255,255,0.20)';g.fillStyle='rgba(255,255,255,0.30)';g.lineWidth=3;
  g.beginPath();g.moveTo(325,40);g.lineTo(325,610);g.stroke();
  [[325,325],[975,325],[650,325]].forEach(([x,y])=>{g.beginPath();g.arc(x,y,7,0,7);g.fill();});
  g.beginPath();g.arc(650,325,82,0,7);g.stroke();
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;}
function rosette(g,s){
  g.save();g.strokeStyle='#d5dbe6';g.lineWidth=Math.max(2,s*0.014);g.shadowColor='#000';g.shadowBlur=3;g.lineCap='round';
  for(let k=0;k<8;k++){g.save();g.rotate(k*Math.PI/4);
    for(let m=0;m<2;m++){g.save();if(m)g.scale(1,-1);
      g.beginPath();g.moveTo(0,0);g.bezierCurveTo(s*0.10,-s*0.04,s*0.30,-s*0.16,s*0.26,-s*0.32);g.bezierCurveTo(s*0.23,-s*0.40,s*0.14,-s*0.38,s*0.16,-s*0.31);g.stroke();
      g.restore();}
    g.beginPath();g.arc(s*0.40,0,s*0.022,0,7);g.fillStyle='#d5dbe6';g.fill();
    g.restore();}
  g.beginPath();g.arc(0,0,s*0.09,0,7);g.stroke();
  g.beginPath();g.arc(0,0,s*0.05,0,7);g.fillStyle='#e8b04a';g.fill();
  g.restore();}
function ornTex(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,w,h);gr.addColorStop(0,'#1e2c4a');gr.addColorStop(1,'#0c1528');
  const r=Math.min(w,h)*0.18;
  g.beginPath();g.moveTo(r,0);g.arcTo(w,0,w,h,r);g.arcTo(w,h,0,h,r);g.arcTo(0,h,0,0,r);g.arcTo(0,0,w,0,r);g.closePath();
  g.fillStyle=gr;g.fill();g.lineWidth=5;g.strokeStyle='#aeb7c6';g.stroke();
  g.save();g.translate(w/2,h/2);rosette(g,Math.min(w,h)*0.95);g.restore();
  if(w>h*1.2){[-1,1].forEach(sx=>{g.save();g.translate(w/2+sx*w*0.34,h/2);rosette(g,h*0.5);g.restore();});}
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;}

/* ---------- Mesa ---------- */
const pockets=[[-HX,-HZ],[HX,-HZ],[-HX,HZ],[HX,HZ],[0,-6.9],[0,6.9]].map(p=>({x:p[0],z:p[1],r:PR}));

// feltro com recortes circulares nas caçapas
(function(){
  const pts=[];
  const arc=(cx,cz,r,a0,a1,n)=>{for(let i=0;i<=n;i++){const a=(a0+(a1-a0)*i/n)*Math.PI/180;pts.push([cx+r*Math.cos(a),cz+r*Math.sin(a)]);}};
  const A=Math.asin(0.4/PR)*180/Math.PI, mx=Math.sqrt(PR*PR-0.16), ex=HX-PR, ez=HZ-PR;
  pts.push([-ex,-HZ],[-mx,-HZ]);
  arc(0,-6.9,PR,180-A,A,14);
  pts.push([mx,-HZ],[ex,-HZ]);
  arc(HX,-HZ,PR,180,90,14);
  pts.push([HX,ez]);
  arc(HX,HZ,PR,270,180,14);
  pts.push([mx,HZ]);
  arc(0,6.9,PR,360-A,180+A,14);
  pts.push([-mx,HZ],[-ex,HZ]);
  arc(-HX,HZ,PR,0,-90,14);
  pts.push([-HX,-ez]);
  arc(-HX,-HZ,PR,90,0,14);
  const sh=new THREE.Shape(pts.map(p=>new THREE.Vector2(p[0],-p[1])));
  const fg=new THREE.ShapeGeometry(sh,8);fg.rotateX(-Math.PI/2);
  const felt=new THREE.Mesh(fg,new THREE.MeshStandardMaterial({map:feltTex(),roughness:1,metalness:0}));
  felt.receiveShadow=true;scene.add(felt);
})();
// marcações no feltro
const marks=new THREE.Mesh(new THREE.PlaneGeometry(26,13),new THREE.MeshBasicMaterial({map:markTex(),transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2}));
marks.rotation.x=-Math.PI/2;marks.position.y=0.004;scene.add(marks);

// interior das caçapas: tudo preto (fundo, tubo e revestimento do vão da moldura)
const blackMat=new THREE.MeshBasicMaterial({color:0x000000,side:THREE.DoubleSide});
const pit=new THREE.Mesh(new THREE.PlaneGeometry(29,16),new THREE.MeshBasicMaterial({color:0}));
pit.rotation.x=-Math.PI/2;pit.position.y=-2.6;scene.add(pit);
pockets.forEach(p=>{
  const m=new THREE.Mesh(new THREE.CylinderGeometry(PR+0.03,PR+0.03,2.6,28,1,true),blackMat);m.position.set(p.x,-1.3,p.z);scene.add(m);
});
// forro preto por dentro do vão da moldura (esconde as paredes marrons)
const liner=new THREE.Mesh(new THREE.BoxGeometry(27.96,6,14.96),new THREE.MeshBasicMaterial({color:0x000000,side:THREE.BackSide}));
liner.position.y=-2;scene.add(liner);

// moldura (couro azul-marinho) até o chão
function rr(w,h,r){const s=new THREE.Shape();
  s.moveTo(-w+r,-h);s.lineTo(w-r,-h);s.quadraticCurveTo(w,-h,w,-h+r);s.lineTo(w,h-r);s.quadraticCurveTo(w,h,w-r,h);
  s.lineTo(-w+r,h);s.quadraticCurveTo(-w,h,-w,h-r);s.lineTo(-w,-h+r);s.quadraticCurveTo(-w,-h,-w+r,-h);return s;}
(function(){
  const fs=rr(16.4,9.9,0.9);
  const hole=new THREE.Path();hole.moveTo(-14,-7.5);hole.lineTo(14,-7.5);hole.lineTo(14,7.5);hole.lineTo(-14,7.5);hole.closePath();
  fs.holes.push(hole);
  const g=new THREE.ExtrudeGeometry(fs,{depth:6,bevelEnabled:true,bevelThickness:0.12,bevelSize:0.12,bevelSegments:3,curveSegments:12});
  g.rotateX(-Math.PI/2);g.translate(0,-5,0);
  const top=new THREE.MeshStandardMaterial({map:leatherTex(),roughness:0.5,metalness:0.3});
  const side=new THREE.MeshStandardMaterial({color:0x2a1810,roughness:0.4,metalness:0.2});
  const m=new THREE.Mesh(g,[top,side]);m.receiveShadow=true;scene.add(m);
})();
const fl=new THREE.Mesh(new THREE.PlaneGeometry(160,160),new THREE.MeshStandardMaterial({color:0x0b1426,roughness:0.9}));
fl.rotation.x=-Math.PI/2;fl.position.y=-5.02;fl.receiveShadow=true;scene.add(fl);

// almofadas (borda de feltro) + paredes de física
const cushMat=new THREE.MeshStandardMaterial({color:0x8e1018,roughness:1});
const CH=(HX-2*PR)/2, SH=HZ-PR;
[[-HX/2,-HZ-.5,CH,.5],[HX/2,-HZ-.5,CH,.5],[-HX/2,HZ+.5,CH,.5],[HX/2,HZ+.5,CH,.5],
 [-HX-.5,0,.5,SH],[HX+.5,0,.5,SH]].forEach(([x,z,hx,hz])=>{
  const b=new CANNON.Body({mass:0,material:mWall,shape:new CANNON.Box(new CANNON.Vec3(hx,1,hz))});
  b.position.set(x,0.5,z);world.addBody(b);
  const m=new THREE.Mesh(new THREE.BoxGeometry(hx*2,0.7,hz*2),cushMat);
  m.position.set(x,0.35,z);m.castShadow=m.receiveShadow=true;scene.add(m);
});

// enfeites: losangos dourados e placas prateadas
const goldMat=new THREE.MeshStandardMaterial({color:0xe3a53a,roughness:0.3,metalness:0.9});
const darkMat=new THREE.MeshStandardMaterial({color:0x3a1d05,roughness:0.6});
function dot(x,z){
  const a=new THREE.Mesh(new THREE.CylinderGeometry(0.24,0.24,0.04,6),goldMat);a.position.set(x,1.14,z);a.rotation.y=Math.PI/6;scene.add(a);
  const b=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.05,6),darkMat);b.position.set(x,1.16,z);scene.add(b);
}
[3.25,6.5,9.75].forEach(x=>[-1,1].forEach(sx=>[-1,1].forEach(sz=>dot(sx*x,sz*8.7))));
[-3.25,0,3.25].forEach(z=>[-1,1].forEach(sx=>dot(sx*15.2,z)));
function plate(w,h,x,z,tw,th){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({map:ornTex(tw,th),roughness:0.4,metalness:0.5,transparent:true,polygonOffset:true,polygonOffsetFactor:-2}));
  m.rotation.x=-Math.PI/2;m.position.set(x,1.135,z);scene.add(m);
}
[-1,1].forEach(sx=>[-1,1].forEach(sz=>plate(2.2,2.2,sx*15.2,sz*8.7,256,256)));
[-1,1].forEach(sz=>plate(3.4,2.0,0,sz*8.7,384,226));

/* ---------- Luzes ---------- */
scene.add(new THREE.HemisphereLight(0x8899bb,0x221100,0.4));
const lamps=new THREE.Group();scene.add(lamps);
[-8,0,8].forEach(x=>{
  const s=new THREE.SpotLight(0xfff1d6,0.95,0,0.95,0.6,1);s.position.set(x,12,0);
  s.target.position.set(x,0,0);scene.add(s.target);s.castShadow=true;
  s.shadow.mapSize.set(1024,1024);s.shadow.bias=-0.0004;s.shadow.camera.near=6;s.shadow.camera.far=20;scene.add(s);
  const cone=new THREE.Mesh(new THREE.ConeGeometry(1.4,1,24,1,true),new THREE.MeshStandardMaterial({color:0x1a3a28,side:THREE.DoubleSide,roughness:.5}));
  cone.position.set(x,12.6,0);lamps.add(cone);
  const bulb=new THREE.Mesh(new THREE.SphereGeometry(.25,12,8),new THREE.MeshBasicMaterial({color:0xfff1d6}));
  bulb.position.set(x,12.2,0);lamps.add(bulb);
});

/* ---------- Bolas ---------- */
const COLS=['','#f5c400','#1146a8','#d11a1a','#5b2a86','#f07a10','#0b7a3a','#7a1f1f'];
function ballTex(n){
  const c=document.createElement('canvas');c.width=256;c.height=128;const g=c.getContext('2d');
  if(n===0){g.fillStyle='#f4f1e8';g.fillRect(0,0,256,128);}
  else{
    const col=n===8?'#111':COLS[n>8?n-8:n];

    bg.fillStyle='#f4f1e8';bg.beginPath();bg.arc(b.x,b.y,b.r*0.42,0,7);bg.fill();
    bg.fillStyle='#111';bg.font='bold '+(b.r*0.5|0)+'px Arial';bg.textAlign='center';bg.textBaseline='middle';bg.fillText(b.n,b.x,b.y+1);
    const hl=bg.createRadialGradient(b.x-b.r*0.4,b.y-b.r*0.45,1,b.x-b.r*0.4,b.y-b.r*0.45,b.r*0.7);
    hl.addColorStop(0,'rgba(255,255,255,0.7)');hl.addColorStop(1,'rgba(255,255,255,0)');
    bg.fillStyle=hl;bg.beginPath();bg.arc(b.x,b.y,b.r,0,7);bg.fill();
    bg.restore();
  });
}
bgLoop();

/* ---------- Loop ---------- */
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),1/30);
  if(!started){renderer.render(scene,camera);return;}   // nada se mexe antes de começar
  world.step(1/180,dt,8);
  if(cpu&&cur===1&&!over&&started)cpuTick(dt);
  else if(humanTurn()&&state==='aim'&&hasMouse)aimFromMouse();
  let moving=false;
  balls.forEach(b=>{
    const bd=b.body,v=bd.velocity;
    if(!b.pocketed){
      const sp=Math.hypot(v.x,v.z);
      if(bd.position.y<0.45&&sp<0.35){v.x*=0.93;v.z*=0.93;bd.angularVelocity.scale(0.93,bd.angularVelocity);
        if(sp<0.05){v.x=v.z=0;bd.angularVelocity.set(0,0,0);}}
      else if(sp>0.12)moving=true;
      if(sp>0.12)moving=true;
      for(const p of pockets){const dx=bd.position.x-p.x,dz=bd.position.z-p.z;
        if(bd.position.y<0.6&&dx*dx+dz*dz<p.r*p.r){pocketBall(b,p);break;}}
      if(!b.pocketed&&(Math.abs(bd.position.x)>HX+0.6||Math.abs(bd.position.z)>HZ+0.6||bd.position.y>2))pocketBall(b,pockets[0]);
    } else if(bd.position.y<-2.4){b.mesh.visible=false;v.set(0,0,0);bd.position.y=-60;}
    b.mesh.position.copy(bd.position);b.mesh.quaternion.copy(bd.quaternion);
  });

  if(state==='strike'){
    off-=70*dt;
    if(off<=0){off=GAP;pull=0;
      const sp=4.5+strikePower*63;
      cue.body.velocity.set(Math.cos(yaw)*sp,0,Math.sin(yaw)*sp);
      cue.body.angularVelocity.set(0,0,0);first=null;shotStart=potted.length;state='roll';wait=0.4;}
  } else if(state==='roll'){
    wait-=dt;
    if(wait<0&&!moving)endShot();
  } else off=GAP+pull;

  const showCue=(state==='aim'||state==='charge'||state==='strike');
  stick.visible=aim.visible=ghost.visible=showCue;traj.visible=false;
  const dx=Math.cos(yaw),dz=Math.sin(yaw),cp=cue.body.position;
  if(showCue){
    const o=R+off;
    stick.position.set(cp.x-dx*o,R,cp.z-dz*o);stick.rotation.y=-yaw;
    const ae=aimEnd(),t=ae.t;
    const pa=aimGeo.attributes.position;pa.setXYZ(0,cp.x,R,cp.z);pa.setXYZ(1,cp.x+dx*t,R,cp.z+dz*t);pa.needsUpdate=true;
    aim.computeLineDistances();ghost.position.set(cp.x+dx*t,R,cp.z+dz*t);
    if(ae.ball){
      const cx=cp.x+dx*t,cz=cp.z+dz*t,bp=ae.ball.body.position;
      let nx=bp.x-cx,nz=bp.z-cz;const nl=Math.hypot(nx,nz)||1;nx/=nl;nz/=nl;
      const dot=dx*nx+dz*nz,tx=dx-dot*nx,tz=dz-dot*nz,tl=Math.hypot(tx,tz);
      const tp=trajGeo.attributes.position,OL=2.2;
      tp.setXYZ(0,bp.x,R,bp.z);tp.setXYZ(1,bp.x+nx*OL,R,bp.z+nz*OL);
      if(tl>0.08){const len=0.4+1.4*tl;tp.setXYZ(2,cx,R,cz);tp.setXYZ(3,cx+tx/tl*len,R,cz+tz/tl*len);}
      else{tp.setXYZ(2,cx,R,cz);tp.setXYZ(3,cx,R,cz);}
      tp.needsUpdate=true;traj.visible=true;
    }
  }
  pw.style.width=(pull/PULL_MAX*100)+'%';

  // as lâmpadas ficam entre a câmera e a mesa na visão aérea: escondê-las evita a "mancha"
  lamps.visible=!top;

  // direção da câmera: fica estável enquanto o mouse mira (senão a mira "fugiria" do cursor)
  const dv=Math.atan2(Math.sin(yaw-camYaw),Math.cos(yaw-camYaw));
  if(humanTurn()&&state==='aim'){
    if(Math.abs(dv)>0.6)camYaw+=(dv-Math.sign(dv)*0.6)*(1-Math.exp(-dt*4));
  }else if(state!=='charge'){camYaw+=dv*(1-Math.exp(-dt*6));}
  const cdx=Math.cos(camYaw),cdz=Math.sin(camYaw);

  if(top){camPosT.set(0,topHeight(),0);lookT.set(0,0,0);upT.set(0,0,-1);}
  else{camPosT.set(cp.x-cdx*5.5,1.7,cp.z-cdz*5.5);lookT.set(cp.x+cdx*6,0.2,cp.z+cdz*6);upT.set(0,1,0);}
  const k=trans>0?1-Math.exp(-dt*6):1;trans=Math.max(0,trans-dt);
  camera.position.lerp(camPosT,k);camLook.lerp(lookT,k);camera.up.lerp(upT,k).normalize();
  camera.lookAt(camLook);
  renderer.render(scene,camera);
}
camera.position.set(-12,1.7,0);camLook.set(0,0.2,0);
loop();
})();
</script>
